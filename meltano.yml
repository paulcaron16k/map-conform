# Development project: runs map-conform between a smoke-test tap and target-jsonl.
#   uv run meltano run tap-smoke-test map-conform target-jsonl
send_anonymous_usage_stats: false
project_id: "map-conform"
default_environment: test
requires_meltano: ">=4.0"
environments:
- name: test
plugins:
  extractors:
  - name: tap-smoke-test
    variant: meltano
    pip_url: git+https://github.com/meltano/tap-smoke-test.git
    config:
      streams:
      - stream_name: animals
        input_filename: https://raw.githubusercontent.com/meltano/tap-smoke-test/main/demo-data/animals-data.jsonl

  loaders:
  - name: target-jsonl
    variant: andyh1203
    pip_url: target-jsonl

  mappers:
  - name: map-conform
    namespace: map_conform
    pip_url: -e .
    executable: map-conform
    capabilities:
    - about
    - structured-logging
    # Settings are declared with the spec loader (WBS 2.4).
    mappings:
    - name: map-conform
      config: {}
