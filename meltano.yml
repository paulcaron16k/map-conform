# Development project: runs this checkout of map-conform between a smoke-test tap and
# target-jsonl:  uvx meltano install && uvx meltano run tap-smoke-test map-conform target-jsonl
# It is also the source of the plugin's settings: tests/test_settings.py checks they match
# map_conform/settings.py, and bin/render-hub-definition.py builds plugin-definition.yml from
# them. A new setting goes here (wiki/runbooks/dev-environment.md, "Adding a setting").
send_anonymous_usage_stats: false
project_id: "map-conform"
default_environment: test
requires_meltano: ">=4.0"
environments:
- name: test
plugins:
  extractors:
  - name: tap-smoke-test
    variant: meltano
    pip_url: git+https://github.com/meltano/tap-smoke-test.git
    config:
      streams:
      - stream_name: animals
        input_filename: https://raw.githubusercontent.com/meltano/tap-smoke-test/main/demo-data/animals-data.jsonl

  loaders:
  - name: target-jsonl
    variant: andyh1203
    pip_url: target-jsonl

  mappers:
  - name: map-conform
    namespace: map_conform
    pip_url: -e .
    executable: map-conform
    capabilities:
    - about
    - structured-logging
    - stream-maps
    settings:
    - name: spec_path
      kind: string
      label: Spec path
      description: Path to the conform spec (YAML or JSON), relative to the project root.
    - name: spec
      kind: object
      label: Inline spec
      description: An inline conform spec for small cases; deep-merged over spec_path.
    - name: spec_vars
      kind: object
      label: Spec variables
      description: Values for ${name} in the spec. Environment variables are ${env:NAME}.
    - name: strict
      kind: boolean
      value: false
      label: Strict
      description: Treat undeclared columns as errors and make warnings errors.
    - name: allow_python_udfs
      kind: boolean
      value: false
      label: Allow Python UDFs
      description: Allow udfs given as module paths. Entry-point UDFs are always allowed.
    - name: batch_output.mode
      kind: options
      value: batch
      options:
      - {label: Write BATCH files, value: batch}
      - {label: Emit RECORD messages, value: record}
      label: BATCH output mode
    - name: batch_output.format
      kind: options
      value: parquet
      options:
      - {label: Parquet, value: parquet}
      - {label: JSONL, value: jsonl}
      label: BATCH output format
    - name: batch_output.compression
      kind: options
      options:
      - {label: zstd, value: zstd}
      - {label: snappy, value: snappy}
      - {label: gzip, value: gzip}
      - {label: None, value: none}
      label: BATCH output compression
      description: Default zstd for parquet, gzip for jsonl.
    - name: batch_output.storage.root
      kind: string
      label: BATCH output root
      description: An fsspec URL (file://, s3://, ...). Default the input file's directory.
    - name: batch_output.storage.params
      kind: object
      label: BATCH storage options
    - name: batch_output.delete_input
      kind: boolean
      value: false
      label: Delete BATCH input
    - name: batch_output.row_group_size
      kind: integer
      value: 131072
      label: Parquet row group size
    - name: reject.storage
      kind: string
      value: ./.map-conform/rejects
      label: Reject directory
    - name: reject.format
      kind: options
      value: jsonl
      options:
      - {label: JSONL, value: jsonl}
      - {label: Parquet, value: parquet}
      label: Reject format
    - name: metrics_path
      kind: string
      label: Metrics path
      description: Write per-stream metrics as JSON here at the end of the run.
    - name: add_record_metadata
      kind: boolean
      value: false
      label: Add record metadata
      description: Add the seven Singer SDK _sdc_* columns to SCHEMA, RECORD and BATCH output.
    - name: stream_maps
      kind: object
      label: Stream maps
      description: Singer SDK stream maps, translated into the spec; the spec wins per column.
    - name: stream_map_config
      kind: object
      label: Stream map config
      description: SDK stream-map config, config in expressions; merged under spec_vars.
    - name: faker_config
      kind: object
      label: Faker config
      description: SDK Faker config ({seed, locale}); the same as defaults.faker.
    - name: flattening_enabled
      kind: boolean
      label: Flattening enabled
      description: SDK flattening; the same as defaults.nested flatten.
    - name: flattening_max_depth
      kind: integer
      label: Flattening max depth
    - name: flattening_separator
      kind: string
      label: Flattening separator
    - name: flattening_max_key_length
      kind: integer
      label: Flattening max key length
    mappings:
    - name: map-conform
      config:
        spec_path: conform.yml
