[build-system]
requires = [
    "hatchling>=1,<2",
    "hatch-vcs>=0.5",
]
build-backend = "hatchling.build"

[project]
name = "map-conform"
dynamic = ["version"]
description = "A Singer inline mapper that conforms names, types, values and metadata so data lands clean."
readme = "README.md"
authors = [{ name = "Paul Caron", email = "paulcaron16k@yahoo.com" }]
keywords = [
    "ELT",
    "Meltano",
    "Singer",
    "mapper",
    "data cleaning",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Topic :: Database",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
license = "Apache-2.0"
license-files = [ "LICENSE" ]
requires-python = ">=3.11"
dependencies = [
    "singer-sdk~=0.54.9",
    "typing-extensions>=4.5.0; python_version < '3.13'",
]

[project.optional-dependencies]
faker = [
    "singer-sdk[faker]",
]
s3 = [
    "s3fs>=2026.1.0",
]

[project.urls]
Homepage = "https://github.com/paulcaron16k/map-conform"
Documentation = "https://github.com/paulcaron16k/map-conform/tree/main/docs"
Issues = "https://github.com/paulcaron16k/map-conform/issues"

[project.scripts]
map-conform = 'map_conform.mapper:MapConformMapper.cli'

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "typing" },
]
lint = [
    "ruff>=0.16",
]
test = [
    "pyarrow>=19",
    "pytest>=9",
    "pytest-github-actions-annotate-failures>=0.4",
    "pyyaml>=6.0.4",
    "singer-sdk[testing]",
]
typing = [
    "mypy>=2.1",
    "pyarrow-stubs>=20.0.0.20260819",
    "ty>=0.0.41",
    "types-jsonschema>=4.26.0.20261006",
    "types-pyyaml>=6.0.12.20261113",
]

[tool.hatch.version]
fallback-version = "0.1.0.dev0"
source = "vcs"

[tool.mypy]
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
]
warn_redundant_casts = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.ty.rules]
missing-override-decorator = "error"
unused-type-ignore-comment = "ignore"

[tool.pytest]
addopts = [
    "-ra",
]
filterwarnings = [
    "error",
]
log_level = "INFO"
minversion = "9"
strict = true
testpaths = [
    "tests",
]

[tool.ruff]
line-length = 100
required-version = ">=0.16.0"

[tool.ruff.lint]
future-annotations = true
ignore = [
    "COM812", # conflicts with the formatter
    "CPY001", # the licence is stated once, in LICENSE
    "EM101",  # messages are clearest written where they are raised
    "EM102",
    "TRY003",
]
select = ["ALL"]

[tool.ruff.lint.flake8-type-checking]
# The spec's parser and schema generator read dataclass annotations at runtime.
runtime-evaluated-decorators = ["dataclasses.dataclass"]

[tool.ruff.lint.flake8-bugbear]
# _doc wraps dataclasses.field, so it is a field specifier, not a mutable default.
extend-immutable-calls = ["map_conform.spec.model._doc"]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.per-file-ignores]
"bin/*.py" = [
  "INP001", # stand-alone scripts, not a package
  "S603",   # argv lists built in the script, never from a shell string
  "S607",   # `gh` is resolved from PATH on purpose
  "T201",   # command-line tools print their output
]
"tests/**/*.py" = [
  "S101", # assert is how pytest checks
]

[tool.ruff.lint.pydocstyle]
convention = "google"

# This configuration can be used to customize tox environments
[tool.tox]
requires = [
    "tox>=4.53",
    "tox-uv>=1.35",
]
env_list = [
    "typing",
    { prefix = "3.", start = 11, stop = 14 },  # the supported range; keep in step with the classifiers
]

[tool.tox.env_run_base]
description = "run tests on Python {env_name}"
runner = "uv-venv-lock-runner"
pass_env = [
    "CI",
    "GITHUB_*",
    "MAP_CONFORM_*",
]
dependency_groups = [ "test" ]
commands = [ [ "pytest", { replace = "posargs", default = [ "tests" ], extend = true } ] ]

[tool.tox.env.typing]
description = "type checks"
dependency_groups = [ "test", "typing" ]
commands = [
    [ "mypy", { replace = "posargs", default = [ "map_conform", "tests" ], extend = true } ],
    [ "ty", "check", { replace = "posargs", default = [ "map_conform", "tests" ], extend = true } ],
]
