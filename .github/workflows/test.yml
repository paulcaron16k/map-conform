name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  FORCE_COLOR: 1

permissions:
  contents: read  # read repository contents

jobs:
  build-package:
    name: Build & verify package
    runs-on: ubuntu-latest
    outputs:
      supported-python-versions: ${{ steps.baipp.outputs.supported_python_classifiers_json_array }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # hatch-vcs derives the version from tags
          persist-credentials: false
      - uses: hynek/build-and-inspect-python-package@67230f7b8410ae0052b39c1efc89d89fff43ff10 # v3.0.2
        id: baipp

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: ruff check
        run: uv run --locked --only-group lint ruff check --output-format=github .
      - name: ruff format
        run: uv run --locked --only-group lint ruff format --check .
      - name: Wiki frontmatter
        run: uv run --locked --group test bin/wiki-lint-frontmatter.py

  typing:
    name: Type checking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: mypy and ty
        run: uvx --managed-python --with=tox-uv tox -e typing

  pytest:
    name: Test (Python ${{ matrix.python-version }})
    needs: [build-package]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(needs.build-package.outputs.supported-python-versions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # hatch-vcs derives the version from tags
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tox
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: uvx --with=tox-uv tox -e "$PYTHON_VERSION"

  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # hatch-vcs derives the version from tags
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
      - name: Throughput and regression gate
        env:
          BENCH_RESULTS: bench-results.json
        run: uv run --locked pytest -m bench tests/bench -q -s
      - name: Results
        if: always()
        run: cat bench-results.json >> "$GITHUB_STEP_SUMMARY" || true

  example:
    name: Example project (meltano run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # hatch-vcs derives the version from tags
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - name: meltano install
        working-directory: examples
        run: uvx --python 3.12 meltano==4.4.1 install
      - name: meltano run
        working-directory: examples
        run: |
          mkdir -p output  # the SQLite catalog's directory
          uvx --python 3.12 meltano==4.4.1 run load
      - name: Check the lake
        working-directory: examples
        run: uv run --no-project --with duckdb==1.5.2 python check_lake.py
